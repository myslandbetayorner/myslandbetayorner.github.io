<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>MySland — Мультиплеер, острова, NPC</title>
    <style>
        body { margin: 0; display: flex; height: 100vh; background: #000; font-family: 'Segoe UI', sans-serif; overflow: hidden; color: white; }
        #game-area { position: relative; flex-grow: 1; height: 100vh; display: none; }
        canvas { display: block; width: 100%; height: 100%; }

        #start-screen, #auth-screen, #setup-screen { position: absolute; width: 100%; height: 100%; background: radial-gradient(circle, #1a3a5c, #0a1120); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
        #start-screen h1, #auth-screen h1, #setup-screen h1 { color: #f0c040; font-size: 48px; margin: 0 0 20px; text-shadow: 0 0 20px #ffaa00; }
        .btn { padding: 12px 32px; margin: 6px; font-size: 18px; font-weight: bold; background: #fbbf24; border: none; border-radius: 30px; cursor: pointer; color: #1e293b; transition: 0.2s; }
        .btn:hover { transform: scale(1.05); box-shadow: 0 4px 15px rgba(255,200,0,0.5); }
        input, select { padding: 10px; border-radius: 8px; border: none; background: #1e293b; color: white; font-size: 16px; margin: 6px; width: 200px; }
        #color-picker { display: flex; gap: 8px; }
        .color-option { width: 30px; height: 30px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; transition: 0.2s; }
        .color-option.selected { border-color: #fbbf24; box-shadow: 0 0 10px #fbbf24; }

        .panel { background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(255,255,255,0.15); border-radius: 12px; pointer-events: all; backdrop-filter: blur(10px); }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        #settings-btn { position: absolute; top: 180px; right: 20px; width: 45px; height: 45px; font-size: 24px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        #settings-window { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 320px; padding: 20px; display: none; flex-direction: column; gap: 15px; z-index: 2000; }

        #console-wrap { position: absolute; bottom: 40px; left: 20px; width: 400px; display: none; flex-direction: column; pointer-events: all; z-index: 1000; }
        #console-input { background: rgba(0,0,0,0.9); border: 2px solid #fbbf24; color: #fbbf24; padding: 12px; border-radius: 8px; outline: none; font-family: monospace; width: 100%; box-sizing: border-box; }
        #console-hints { color: #aaa; font-size: 12px; margin-top: 4px; min-height: 16px; }
        #chat-messages { position: absolute; bottom: 80px; left: 20px; width: 400px; max-height: 150px; overflow-y: auto; pointer-events: all; font-size: 14px; color: white; background: rgba(0,0,0,0.5); border-radius: 8px; padding: 6px; }

        #craft-btn { position: absolute; top: 20px; left: 20px; width: 55px; height: 55px; font-size: 28px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        #craft-window { position: absolute; top: 85px; left: 20px; width: 260px; padding: 12px; display: none; flex-direction: column; gap: 6px; overflow-y: auto; max-height: 400px; }
        .recipe { display: flex; justify-content: space-between; align-items: center; }
        .recipe button { padding: 4px 12px; background: #fbbf24; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }

        #minimap { position: absolute; top: 20px; right: 20px; width: 150px; height: 150px; border: 3px solid #334155; border-radius: 10px; overflow: hidden; background: #60a5fa; }
        #m-dot { position: absolute; width: 6px; height: 6px; background: red; border: 1px solid white; border-radius: 50%; transform: translate(-50%, -50%); z-index: 15; }
        #info-panel { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); padding: 8px 16px; border-radius: 20px; font-size: 14px; display: flex; gap: 20px; }
        #info-panel span { color: #fbbf24; }

        #sidebar { width: 100px; background: #0f172a; border-left: 2px solid #1e293b; display: flex; flex-direction: column; align-items: center; padding: 15px 0; gap: 8px; overflow-y: auto; }
        .slot { width: 60px; height: 60px; background: #1e293b; border: 1px solid #334155; border-radius: 10px; display: none; align-items: center; justify-content: center; font-size: 24px; position: relative; }
        .slot.visible { display: flex; }
        .num { position: absolute; bottom: 2px; right: 4px; font-size: 11px; color: #fbbf24; font-weight: bold; }
    </style>
</head>
<body>

<div id="auth-screen">
    <h1>MySland</h1>
    <input type="text" id="auth-nick" placeholder="Ник" maxlength="14">
    <input type="password" id="auth-pass" placeholder="Пароль">
    <div>
        <button class="btn" onclick="register()">Регистрация</button>
        <button class="btn" onclick="login()">Войти</button>
    </div>
    <div id="auth-error" style="color:#f87171; margin-top:10px;"></div>
</div>

<div id="setup-screen" style="display:none;">
    <h1>Настройка мира</h1>
    <div style="display:flex; gap:20px; flex-wrap:wrap; justify-content:center;">
        <div>
            <label>Режим игры</label>
            <select id="game-mode">
                <option value="single">Одиночная игра</option>
                <option value="multiplayer">Мультиплеер (локальный)</option>
            </select>
        </div>
        <div>
            <label>Игровой режим</label>
            <select id="player-mode">
                <option value="survival">Только выживание</option>
                <option value="creative">Только креатив</option>
                <option value="free">Свободный (каждый выбирает)</option>
            </select>
        </div>
        <div>
            <label>Ландшафт</label>
            <select id="biome-preset">
                <option value="islands">Острова (много воды)</option>
                <option value="mixed">Смешанный</option>
                <option value="low_water">Мало океана</option>
                <option value="beach_world">Бескрайний пляж</option>
            </select>
        </div>
    </div>
    <div style="margin:20px;">
        <label>Цвет персонажа:</label>
        <div id="color-picker">
            <div class="color-option" style="background:#f97316;" onclick="selectColor('#f97316', this)"></div>
            <div class="color-option" style="background:#ef4444;" onclick="selectColor('#ef4444', this)"></div>
            <div class="color-option" style="background:#3b82f6;" onclick="selectColor('#3b82f6', this)"></div>
            <div class="color-option" style="background:#22c55e;" onclick="selectColor('#22c55e', this)"></div>
            <div class="color-option" style="background:#a855f7;" onclick="selectColor('#a855f7', this)"></div>
            <div class="color-option" style="background:#ec4899;" onclick="selectColor('#ec4899', this)"></div>
            <div class="color-option" style="background:#eab308;" onclick="selectColor('#eab308', this)"></div>
            <div class="color-option" style="background:#ffffff;" onclick="selectColor('#ffffff', this)"></div>
        </div>
    </div>
    <button class="btn" onclick="startGame()">ИГРАТЬ</button>
</div>

<div id="game-area">
    <canvas id="game"></canvas>
    <div id="ui-layer">
        <div id="info-panel">
            <span id="coords">X: 0 Y: 0</span>
            <span id="biome-name">Биом: ?</span>
        </div>
        <div id="chat-messages"></div>
        <div id="craft-btn" class="panel" onclick="toggleCraft()">🛠</div>
        <div id="minimap" class="panel"><div id="m-dot"></div><canvas id="m-canvas" width="150" height="150"></canvas></div>
        <div id="settings-btn" class="panel" onclick="toggleSettings()">⚙️</div>
        <div id="settings-window" class="panel">
            <h2 style="margin:0 0 10px; color:#fbbf24">Настройки</h2>
            <div class="setting-row"><span>Музыка</span><input type="checkbox" id="music-toggle" checked onchange="updateAudio()"></div>
            <div class="setting-row"><span>Звуки</span><input type="checkbox" id="sound-toggle" checked></div>
            <div>Трек: <select id="music-select" onchange="changeTrack()" style="background:#1e293b; color:white; border:1px solid #444; padding:5px; width:100%;"></select></div>
            <div><input type="file" id="music-upload" accept="audio/*" multiple style="display:none;"><button onclick="document.getElementById('music-upload').click()" style="width:100%; padding:8px; background:#334155; border:none; color:white; border-radius:5px; cursor:pointer;">📂 Загрузить mp3</button></div>
            <button onclick="toggleSettings()" style="margin-top:10px; padding:10px; background:#fbbf24; border:none; border-radius:5px; font-weight:bold; cursor:pointer;">Закрыть</button>
        </div>
        <div id="craft-window" class="panel"><h3 style="margin:0 0 8px; color:#fbbf24">Crafting</h3><div id="recipes-list"></div></div>
        <div id="console-wrap"><input type="text" id="console-input" autocomplete="off" placeholder="Введите команду или сообщение..."><div id="console-hints"></div></div>
    </div>
</div>

<div id="sidebar"></div>

<script>
// ========== ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ==========
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const mctx = document.getElementById('m-canvas').getContext('2d');
const cInput = document.getElementById('console-input');
const hintsDiv = document.getElementById('console-hints');
const chatDiv = document.getElementById('chat-messages');

let playerName = '', playerColor = '#f97316';
let playerMode = 'survival', worldPreset = 'islands', gameMode = 'single';
let player = { x: 2500, y: 2500, speed: 5.5, mode: 'survival', inv: { wood:0, flax:0, stone:0, meat:0, thread:0, rope:0, axe:0, campfire:0, fishing_rod:0, sail:0, tent:0, torch:0, boat:0 } };
let worldSize = 5000, resources = [], animals = [], keys = {}, seed = Math.random(), time = 0;
let audioCtx = null, musicElement = new Audio(), availableTracks = [];
let legPhase = 0, breathPhase = 0;
let otherPlayers = {}; // для мультиплеера: {nick: {x, y, color}}
let channel = null; // BroadcastChannel

// ========== АУДИО ==========
async function checkLocalTracks() {
    availableTracks = [];
    for (let i = 1; i <= 20; i++) {
        try {
            const res = await fetch(`music${i}.mp3`, { method: 'HEAD' });
            if (res.ok) availableTracks.push({ name: `Music ${i}`, src: `music${i}.mp3` });
        } catch(e) {}
    }
    updateTrackList();
}
function handleFileUpload(e) {
    for (let file of e.target.files) {
        if (file.type.startsWith('audio/')) {
            availableTracks.push({ name: file.name.replace(/\.[^/.]+$/, ""), src: URL.createObjectURL(file) });
        }
    }
    updateTrackList();
}
function updateTrackList() {
    const sel = document.getElementById('music-select');
    sel.innerHTML = '';
    if (availableTracks.length === 0) sel.innerHTML = '<option disabled>Нет треков</option>';
    else availableTracks.forEach((t,i) => { const o = document.createElement('option'); o.value=i; o.textContent=t.name; sel.appendChild(o); });
    if (availableTracks.length) changeTrack();
}
function updateAudio() {
    document.getElementById('music-toggle').checked ? musicElement.play().catch(()=>{}) : musicElement.pause();
}
function changeTrack() {
    const idx = document.getElementById('music-select').value;
    if (availableTracks[idx]) { musicElement.src = availableTracks[idx].src; musicElement.loop = true; updateAudio(); }
}
function playSound(freq, type='sine', dur=0.1, vol=0.1) {
    if (!document.getElementById('sound-toggle')?.checked || !audioCtx) return;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type; osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + dur);
}

// ========== РЕГИСТРАЦИЯ / ВХОД ==========
function getUsers() { return JSON.parse(localStorage.getItem('mysland_users') || '{}'); }
function saveUsers(users) { localStorage.setItem('mysland_users', JSON.stringify(users)); }
function register() {
    const nick = document.getElementById('auth-nick').value.trim(), pass = document.getElementById('auth-pass').value.trim();
    if (!nick || !pass) return showAuthError('Введите ник и пароль');
    const users = getUsers();
    if (users[nick]) return showAuthError('Такой ник уже занят');
    users[nick] = pass;
    saveUsers(users);
    playerName = nick;
    showSetup();
}
function login() {
    const nick = document.getElementById('auth-nick').value.trim(), pass = document.getElementById('auth-pass').value.trim();
    const users = getUsers();
    if (!users[nick] || users[nick] !== pass) return showAuthError('Неверный ник или пароль');
    playerName = nick;
    showSetup();
}
function showAuthError(msg) { document.getElementById('auth-error').innerText = msg; }
function showSetup() {
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('setup-screen').style.display = 'flex';
    document.getElementById('player-name').value = playerName; // если есть поле (нет, убрали)
}

// ========== НАСТРОЙКИ ПЕРЕД СТАРТОМ ==========
function selectColor(color, el) {
    playerColor = color;
    document.querySelectorAll('.color-option').forEach(o => o.classList.remove('selected'));
    if (el) el.classList.add('selected');
}

// ========== ГЕНЕРАЦИЯ МИРА (с островами и пресетами) ==========
function getBiomeInfo(x, y) {
    let nx = x/600, ny = y/600;
    let v = Math.sin(nx + seed*10) + Math.cos(ny + seed*5) + Math.sin(nx*0.5)*Math.cos(ny*0.5);
    let d = Math.hypot(x-2500, y-2500)/2200;
    // пресеты меняют пороги океана
    let oceanThreshold = -0.2;
    if (worldPreset === 'islands') oceanThreshold = 0.0;   // почти всё вода, редкие острова
    else if (worldPreset === 'low_water') oceanThreshold = -0.8;
    else if (worldPreset === 'beach_world') oceanThreshold = -0.1; // много пляжа
    let val = v - d;
    if (worldPreset === 'beach_world') val = v - d*0.3; // ослабляем центр
    return val;
}
function getBiomeColor(val) {
    const ocean = {r:0x60, g:0xa5, b:0xfa}, beach = {r:0xea, g:0xb3, b:0x08}, forest = {r:0x15, g:0x80, b:0x3d};
    if (val < -0.2) return ocean;
    if (val < 0) return lerpColor(ocean, beach, (val+0.2)/0.2);
    if (val < 0.2) return lerpColor(beach, forest, val/0.2);
    return forest;
}
function lerpColor(c1,c2,t) {
    return { r: Math.round(c1.r+(c2.r-c1.r)*t), g: Math.round(c1.g+(c2.g-c1.g)*t), b: Math.round(c1.b+(c2.b-c1.b)*t) };
}
function getBiomeName(val) { if (val < -0.2) return 'Океан'; if (val < 0) return 'Пляж'; return 'Лес'; }
function isWater(val) { return val < -0.2; }

function spawnWorld() {
    for(let i=0; i<1000; i++) {
        let rx=1000+Math.random()*3000, ry=1000+Math.random()*3000;
        if(!isWater(getBiomeInfo(rx,ry))) { player.x=rx; player.y=ry; break; }
    }
    for(let i=0; i<500; i++) {
        let rx=Math.random()*worldSize, ry=Math.random()*worldSize;
        if(!isWater(getBiomeInfo(rx,ry))) {
            let val = getBiomeInfo(rx,ry);
            resources.push({x:rx, y:ry, t: val<0 ? 'stone' : 'wood'});
        }
    }
    for(let i=0; i<15; i++) {
        let rx=Math.random()*worldSize, ry=Math.random()*worldSize;
        if(!isWater(getBiomeInfo(rx,ry))) animals.push({x:rx, y:ry, t: Math.random()<0.4?'tiger':'giraffe'});
    }
}

// ========== МУЛЬТИПЛЕЕР ==========
function initMultiplayer() {
    if (gameMode !== 'multiplayer') return;
    channel = new BroadcastChannel('mysland_multi');
    channel.onmessage = (e) => {
        const data = e.data;
        if (data.type === 'position' && data.nick !== playerName) {
            otherPlayers[data.nick] = { x: data.x, y: data.y, color: data.color };
        } else if (data.type === 'chat') {
            if (data.to && data.to !== playerName && data.to !== 'all') return;
            addChatMessage(data.nick + ': ' + data.text);
        }
    };
    // отправлять свою позицию 10 раз в секунду
    setInterval(() => {
        if (channel) channel.postMessage({ type: 'position', nick: playerName, x: player.x, y: player.y, color: playerColor });
    }, 100);
}

function sendChat(msg) {
    if (msg.startsWith('/')) {
        executeCommand(msg);
    } else {
        let to = 'all';
        let text = msg;
        if (msg.startsWith('@')) {
            const spaceIdx = msg.indexOf(' ');
            if (spaceIdx > 1) {
                to = msg.substring(1, spaceIdx);
                text = msg.substring(spaceIdx+1);
            }
        }
        if (channel) channel.postMessage({ type: 'chat', nick: playerName, text, to });
        addChatMessage(playerName + ': ' + text); // себе тоже
    }
}

function addChatMessage(txt) {
    const div = document.createElement('div');
    div.innerText = txt;
    chatDiv.appendChild(div);
    chatDiv.scrollTop = chatDiv.scrollHeight;
}

// ========== ИНТЕРФЕЙС ==========
function updateUI() {
    for(let k in player.inv) {
        const el = document.getElementById('inv-'+k), s = document.getElementById('slot-'+k);
        if(el) el.innerText = player.inv[k];
        if(s) player.inv[k]>0 ? s.classList.add('visible') : s.classList.remove('visible');
    }
    document.getElementById('coords').innerText = `X: ${Math.round(player.x)} Y: ${Math.round(player.y)}`;
    document.getElementById('biome-name').innerText = `Биом: ${getBiomeName(getBiomeInfo(player.x, player.y))}`;
}

function toggleSettings() {
    document.getElementById('settings-window').style.display = 
        document.getElementById('settings-window').style.display === 'flex' ? 'none' : 'flex';
}
function toggleCraft() {
    const w = document.getElementById('craft-window');
    w.style.display = w.style.display === 'flex' ? 'none' : 'flex';
    if (w.style.display === 'flex') {
        document.getElementById('recipes-list').innerHTML = `
            <div><b>Материалы</b></div>
            <div class="recipe">🧵 Нить (1🌿→2) <button onclick="craft('thread',{flax:1},2)">Создать</button></div>
            <div class="recipe">🪢 Верёвка (2🧵→1) <button onclick="craft('rope',{thread:2},1)">Создать</button></div>
            <div><b>Инструменты</b></div>
            <div class="recipe">🪓 Топор (2🌲+1🗿) <button onclick="craft('axe',{wood:2,stone:1},1)">Создать</button></div>
            <div class="recipe">🎣 Удочка (2🌲+1🪢) <button onclick="craft('fishing_rod',{wood:2,rope:1},1)">Создать</button></div>
            <div><b>Предметы</b></div>
            <div class="recipe">🔥 Костёр (2🌲+1🧵) <button onclick="craft('campfire',{wood:2,thread:1},1)">Создать</button></div>
            <div class="recipe">⛵ Парус (4🌿+2🪢) <button onclick="craft('sail',{flax:4,rope:2},1)">Создать</button></div>
            <div class="recipe">🏕️ Палатка (4🌲+2🪢) <button onclick="craft('tent',{wood:4,rope:2},1)">Создать</button></div>
            <div class="recipe">🔦 Факел (1🌲+1🌿) <button onclick="craft('torch',{wood:1,flax:1},1)">Создать</button></div>
            <div class="recipe">🚣 Лодка (10🌲) <button onclick="craft('boat',{wood:10},1)">Создать</button></div>
        `;
    }
}
function craft(id, cost, amount=1) {
    for(let k in cost) if(!player.inv[k] || player.inv[k]<cost[k]) return;
    for(let k in cost) player.inv[k] -= cost[k];
    player.inv[id] += amount;
    playSound(800, 'sine', 0.3);
    updateUI();
}

// ========== КОМАНДЫ ==========
function executeCommand(cmd) {
    const parts = cmd.trim().split(/\s+/);
    const command = parts[0].toLowerCase();
    if (command === '/help') {
        addChatMessage('Команды: /tp biome [Ocean|Beach|Forest], /tp coord X Y, /creative, /survival, /give предмет кол-во, /spawn tiger|giraffe, /clear, /save');
    } else if (command === '/tp') {
        if (parts[1] === 'biome' && parts[2]) {
            const target = parts[2].toLowerCase();
            let tv = target==='ocean' ? -0.5 : target==='beach' ? -0.1 : 0.3;
            for (let i=0; i<100; i++) {
                let rx=Math.random()*worldSize, ry=Math.random()*worldSize;
                if ((tv===-0.5 && getBiomeInfo(rx,ry)<-0.2) || (tv===-0.1 && getBiomeInfo(rx,ry)>=-0.2 && getBiomeInfo(rx,ry)<0) || (tv===0.3 && getBiomeInfo(rx,ry)>=0)) {
                    player.x=rx; player.y=ry; break;
                }
            }
        } else if (parts[1]==='coord' && parts.length===4) {
            player.x = Math.max(0, Math.min(worldSize, parseInt(parts[2])));
            player.y = Math.max(0, Math.min(worldSize, parseInt(parts[3])));
        }
    } else if (command === '/creative') { player.mode = 'creative'; }
    else if (command === '/survival') { player.mode = 'survival'; }
    else if (command === '/give' && parts.length===3) {
        const item = parts[1], amt = parseInt(parts[2]);
        if (player.inv.hasOwnProperty(item)) player.inv[item] += amt;
    } else if (command === '/spawn' && parts[1]) {
        const t = parts[1];
        if (t==='tiger'||t==='giraffe') animals.push({x: player.x+50, y: player.y+50, t});
    } else if (command === '/clear') { for(let k in player.inv) player.inv[k]=0; }
}

// ========== ОТРИСОВКА (животные canvas) ==========
function drawTiger(x, y) {
    ctx.save(); ctx.translate(x, y);
    ctx.fillStyle = '#e07b39';
    ctx.fillRect(-12, -8, 24, 18);
    ctx.fillStyle = '#f5a65a';
    ctx.fillRect(-10, -6, 8, 6);
    ctx.fillRect(2, -6, 8, 6);
    ctx.fillStyle = '#333';
    ctx.fillRect(-10, -8, 4, 2); ctx.fillRect(2, -8, 4, 2);
    ctx.fillRect(-12, 0, 24, 4);
    ctx.fillStyle = '#e07b39';
    ctx.fillRect(-14, -6, 4, 10);
    ctx.fillRect(10, -6, 4, 10);
    ctx.restore();
}
function drawGiraffe(x, y) {
    ctx.save(); ctx.translate(x, y);
    ctx.fillStyle = '#d4a52c';
    ctx.fillRect(-6, -20, 12, 24);
    ctx.fillStyle = '#8b5a2b';
    ctx.fillRect(-3, -18, 3, 3); ctx.fillRect(3, -14, 3, 3); ctx.fillRect(-5, -8, 4, 4); ctx.fillRect(2, -6, 3, 3);
    ctx.fillStyle = '#d4a52c';
    ctx.fillRect(-10, -6, 6, 16); ctx.fillRect(4, -6, 6, 16);
    ctx.fillRect(-6, -24, 4, 6); ctx.fillRect(2, -24, 4, 6);
    ctx.fillStyle = '#333'; ctx.fillRect(-4, -26, 2, 2); ctx.fillRect(2, -26, 2, 2);
    ctx.restore();
}

// ========== ИГРОВОЙ ЦИКЛ ==========
function loop() {
    time += 0.016;
    let nx = player.x, ny = player.y, mv = false;
    if (document.activeElement !== cInput) {
        if(keys['KeyW']) { ny -= player.speed; mv = true; }
        if(keys['KeyS']) { ny += player.speed; mv = true; }
        if(keys['KeyA']) { nx -= player.speed; mv = true; }
        if(keys['KeyD']) { nx += player.speed; mv = true; }
    }
    if (mv) legPhase += 0.25;
    breathPhase += 0.03;
    const val = getBiomeInfo(nx, ny);
    if (player.mode === 'creative' || !isWater(val) || player.inv.boat > 0) {
        player.x = nx; player.y = ny;
        if (mv) playSound(200, 'square', 0.03, 0.03);
    }
    // сбор ресурсов и охота
    for (let i=resources.length-1; i>=0; i--) {
        if (Math.hypot(player.x-resources[i].x, player.y-resources[i].y) < 30) {
            player.inv[resources[i].t]++; resources.splice(i,1); updateUI();
        }
    }
    for (let i=animals.length-1; i>=0; i--) {
        let a = animals[i];
        if (a.t==='tiger' && Math.hypot(player.x-a.x, player.y-a.y)<200) {
            a.x += (player.x-a.x)*0.01; a.y += (player.y-a.y)*0.01;
        }
        if (keys['KeyF'] && Math.hypot(player.x-a.x, player.y-a.y)<50) {
            player.inv.meat++; animals.splice(i,1); updateUI();
        }
    }
    // рендер
    let night = Math.max(0, Math.sin(time/300)*0.8);
    let cx = player.x - canvas.width/2, cy = player.y - canvas.height/2;
    // небо
    const dayTop = '#87CEEB', nightTop = '#0a0a2e';
    ctx.fillStyle = lerpColor(hexToRgb(dayTop), hexToRgb(nightTop), night);
    ctx.fillRect(0,0,canvas.width,canvas.height);
    // мир (мелкие блоки для сглаживания)
    const step = 5;
    for(let x=Math.floor(cx/step)*step; x<cx+canvas.width+step; x+=step) {
        for(let y=Math.floor(cy/step)*step; y<cy+canvas.height+step; y+=step) {
            const col = getBiomeColor(getBiomeInfo(x,y));
            ctx.fillStyle = `rgb(${col.r},${col.g},${col.b})`;
            ctx.fillRect(x-cx, y-cy, step, step);
        }
    }
    // ресурсы
    resources.forEach(r => {
        let sx = r.x-cx, sy = r.y-cy;
        if (r.t==='wood') {
            ctx.fillStyle='#5c3a1e'; ctx.fillRect(sx-4, sy, 8, 22);
            ctx.fillStyle='#2d6a1e'; ctx.beginPath(); ctx.arc(sx, sy-8, 14, 0, Math.PI*2); ctx.fill();
        } else {
            ctx.fillStyle='#6b7280'; ctx.beginPath(); ctx.ellipse(sx, sy+5, 14, 10, 0, 0, Math.PI*2); ctx.fill();
        }
    });
    // животные
    animals.forEach(a => {
        let sx = a.x-cx, sy = a.y-cy;
        if (a.t==='tiger') drawTiger(sx, sy);
        else drawGiraffe(sx, sy);
    });
    // другие игроки
    for (let nick in otherPlayers) {
        const op = otherPlayers[nick];
        let sx = op.x-cx, sy = op.y-cy;
        ctx.fillStyle = op.color;
        ctx.fillRect(sx-6, sy-6, 12, 12);
        ctx.fillStyle = 'white';
        ctx.font = '10px sans-serif'; ctx.fillText(nick, sx-10, sy-12);
    }
    // персонаж
    drawPlayer(mv);
    // ночь
    ctx.fillStyle = `rgba(0,0,30,${night*0.4})`;
    ctx.fillRect(0,0,canvas.width,canvas.height);
    // миникарта
    document.getElementById('m-dot').style.left = (player.x/worldSize*150)+'px';
    document.getElementById('m-dot').style.top = (player.y/worldSize*150)+'px';
    updateUI();
    requestAnimationFrame(loop);
}

function drawPlayer(mv) {
    const cx = canvas.width/2, cy = canvas.height/2;
    const legSwing = mv ? Math.sin(legPhase)*8 : 0;
    ctx.save(); ctx.translate(cx, cy-10+Math.sin(breathPhase)*1.5);
    ctx.fillStyle = playerColor;
    ctx.fillRect(-6, 8, 6, 12+Math.abs(legSwing)*0.5);
    ctx.fillRect(0, 8, 6, 12-Math.abs(legSwing)*0.5);
    ctx.fillRect(-8, -8, 16, 16);
    ctx.fillRect(-14, -6, 6, 12);
    ctx.fillRect(8, -6, 6, 12);
    ctx.beginPath(); ctx.arc(0, -12, 8, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle='white'; ctx.beginPath(); ctx.arc(-3,-14,2,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(3,-14,2,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='black'; ctx.beginPath(); ctx.arc(-3,-14,1,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(3,-14,1,0,Math.PI*2); ctx.fill();
    ctx.restore();
    ctx.fillStyle='white'; ctx.font='12px sans-serif'; ctx.textAlign='center'; ctx.fillText(playerName, cx, cy-30);
}

function hexToRgb(hex) { return {r:parseInt(hex[1]+hex[2],16), g:parseInt(hex[3]+hex[4],16), b:parseInt(hex[5]+hex[6],16)}; }
function rgbToHex({r,g,b}) { return `#${((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1)}`; }

// ========== СТАРТ ==========
function startGame() {
    gameMode = document.getElementById('game-mode').value;
    playerMode = document.getElementById('player-mode').value;
    worldPreset = document.getElementById('biome-preset').value;
    if (playerMode === 'survival') player.mode = 'survival';
    else if (playerMode === 'creative') player.mode = 'creative';
    // в свободном режиме игрок сам выберет позже через /creative или /survival
    document.getElementById('setup-screen').style.display = 'none';
    document.getElementById('game-area').style.display = 'block';
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    checkLocalTracks();
    document.getElementById('music-upload').addEventListener('change', handleFileUpload);
    spawnWorld();
    initMultiplayer();
    resize(); updateUI(); loop();
}

window.onkeydown = e => {
    if (e.code==='KeyT' && document.activeElement!==cInput) {
        e.preventDefault();
        document.getElementById('console-wrap').style.display='flex';
        cInput.focus();
    }
    if (e.code==='Enter' && document.activeElement===cInput) {
        const msg = cInput.value.trim();
        if (msg) sendChat(msg);
        cInput.value = '';
        document.getElementById('console-wrap').style.display='none';
        cInput.blur();
    }
    keys[e.code] = true;
};
window.onkeyup = e => keys[e.code] = false;
function resize() { canvas.width = document.getElementById('game-area').clientWidth; canvas.height = window.innerHeight; }
window.onresize = resize;

// Слоты инвентаря
(function(){
    const sidebar = document.getElementById('sidebar');
    const items = [
        'wood','flax','stone','meat','thread','rope','axe','campfire','fishing_rod','sail','tent','torch','boat'
    ];
    const icons = {
        wood:'🌲',flax:'🌿',stone:'🗿',meat:'🥩',thread:'🧵',rope:'🪢',axe:'🪓',campfire:'🔥',
        fishing_rod:'🎣',sail:'⛵',tent:'🏕️',torch:'🔦',boat:'🚣'
    };
    items.forEach(id => {
        const div = document.createElement('div');
        div.className = 'slot'; div.id = 'slot-'+id;
        div.innerHTML = `${icons[id]}<span class="num" id="inv-${id}">0</span>`;
        sidebar.appendChild(div);
    });
})();
</script>
